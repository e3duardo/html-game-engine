	<!-- every coordinate below was measured pixel-by-pixel off
			the reference screenshot (32px/tile at its 2x scale,
			wall's left edge = tile 0, floor's top edge = tile 2) -
			not eyeballed. top row and platform share the exact
			same 7-tile span (244-250); only the top coin row is
			narrower (5-tile, centered one column in from each
			side). every brick here is line="false" - the reference
			screenshot's bonus/warp-zone bricks never have the
			lighter mortar-line variant, unlike the main path. -->
	<item-brick x="244" y="12" line="false"></item-brick>
	<item-brick x="245" y="12" line="false"></item-brick>

			what's on screen. decorative="true" (not solid/
			enterable) since it's not something mario ever sees or
			interacts with directly. -->
	<item-pipe orientation="down" size="2" x="241" y="256" decorative="true"></item-pipe>
	<!-- the actual warp landing spot, right at that hidden
			pipe's own mouth, so mario appears exactly where it
			opens (still off-screen) and gravity carries him down
			into view - see the `warpId` read added to
			Collidable.js for why a plain invisible/non-solid
			marker (not the pipe itself) is what SceneBase.warp()
			actually targets. -->
	<!-- lock-scroll-x=240 (tile units, same as everything else -
			see SceneBase.warp()) pins the camera to this room's own
			left edge (the wall) on entry, instead of centering on
			wherever mario happens to land - the room is exactly one
			screen wide, so there's nothing to scroll to anyway. -->
	<game-portal x="241" y="16" warp-id="warpzone-entrance" lock-scroll-x="240"></game-portal>
	<!-- the reference's pipe mouth is a genuinely horizontal
			piece (tileset.png cols 2/3/4 @ rows 8/9 - see Pipe.js's
			h1/h2/h3/h1b/h2b/h3b), not the vertical cap - 3 tiles
			long, 2 tall, sitting on the floor, with a thin 1-tile
			smokestack riser rising off its rightmost column,
			matching the reference pixel-for-pixel (room tiles
			253-255, riser at 255). this IS the warp trigger now -
			solid (no decorative="true"), so mario has to jump onto
			its top like any other pipe instead of just walking
			through it, and pressing down anywhere on that top
			works (not a separate hidden 1-tile stub underneath,
			which was too easy to miss entirely and left the mouth
			itself walk-through-able). -->
	<item-pipe orientation="left" size="3" x="253" warp-id="warpzone-exit" warp-to="pipe-163"></item-pipe>
